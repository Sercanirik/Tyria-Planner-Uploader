name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # required for creating releases on tag push

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TyriaUploader.sln

      - name: Build
        run: dotnet build TyriaUploader.sln -c Release --no-restore

      - name: Publish (single-file, self-contained, win-x64)
        run: >
          dotnet publish TyriaUploader/TyriaUploader.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TyriaUploader-${{ github.sha }}
          path: publish/TyriaUploader.exe
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/TyriaUploader.exe
          draft: false
          prerelease: false
          generate_release_notes: true
