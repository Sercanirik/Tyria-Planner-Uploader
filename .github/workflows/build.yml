name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # required for creating releases on tag push

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TyriaUploader.sln

      - name: Build
        run: dotnet build TyriaUploader.sln -c Release --no-restore

      - name: Publish (single-file, self-contained, win-x64)
        # publish/ contains TyriaUploader.exe alongside the bundled GW2EI/ folder
        # (csproj <Content> rules copy it next to the exe, ExcludeFromSingleFile
        # keeps it as loose files instead of extracting on every launch).
        run: >
          dotnet publish TyriaUploader/TyriaUploader.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Package release zip
        shell: pwsh
        run: |
          $name = "TyriaUploader-${{ github.sha }}"
          Compress-Archive -Path publish/* -DestinationPath "$name.zip" -Force
          if (Test-Path "publish/TyriaUploader.exe") {
            Write-Host "Zip contains:"
            (Get-ChildItem publish -Recurse | Select-Object -ExpandProperty FullName) | ForEach-Object {
              $_.Replace("$PWD\publish\", "  ")
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TyriaUploader-${{ github.sha }}
          path: TyriaUploader-${{ github.sha }}.zip
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TyriaUploader-${{ github.sha }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
